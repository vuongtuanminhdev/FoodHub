spring.application.name=FoodHub
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/foodhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Mot2ba4nam
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=30000

# Debug logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.foodhub=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# MySQL Connection Test
spring.sql.init.mode=always